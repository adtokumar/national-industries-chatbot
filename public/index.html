<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Industries (Namibind) Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-wrapper">
    <!-- Chat Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar-container">
          <div class="seller-avatar">N</div>
          <span class="status-dot"></span>
        </div>
        <div class="seller-info">
          <div class="seller-name-row">
            <h2>National Industries <span class="brand-tag">Namibind</span></h2>
          </div>
          <p class="seller-status">Verified IndiaMART Seller • Online</p>
        </div>
      </div>
      <div class="header-right">
        <button id="reset-btn" class="icon-btn" title="Start New Chat" aria-label="Restart conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>New Chat</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Stream (Chips appear inside the last message bubble) -->
    <main id="chat-messages" class="chat-messages">
      <!-- Messages, product cards, and chips will be injected here -->
    </main>

    <!-- Chat Input Area -->
    <footer class="chat-input-bar">
      <form id="chat-form" class="input-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Type your message or requirement..." 
          autocomplete="off"
          required
        >
        <button type="submit" id="send-btn" class="send-btn" title="Send message" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
